name: PRISM conformance (release gate)

# Roadmap 2.7 / 6.1 / 6.2. Any wrong proof (PROVED, PROVED-UNBOUNDED,
# PROVED-ASSUMING or PROVED-CERTIFIED on a task with a known violation)
# fails this workflow and blocks a release. See docs/CONFORMANCE.md.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: adds random-program testing and Juliet
  workflow_dispatch:
    inputs:
      random_programs:
        description: "programs for tools/csmith_soundness.py"
        default: "300"

permissions:
  contents: read

jobs:
  build:
    name: Build prism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-conf-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/z3/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: ccache-conf-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/z3/CMakeLists.txt') }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=OFF -DPRISM_Z3=ON
      - name: Build
        run: cmake --build build --target prism
      - uses: actions/upload-artifact@v4
        with:
          name: prism-conformance-bin
          path: build/prism
          retention-days: 7

  conformance:
    name: Conformance suite (soundness gate)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sanitizer runtimes, bwrap, PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev bubblewrap
          python -m pip install pyyaml pytest
      - uses: actions/download-artifact@v4
        with:
          name: prism-conformance-bin
          path: build
      - name: Suite labels (sanitizer self-check)
        run: python tools/conformance.py --self-check --out conformance-out
      - name: Scorer unit tests
        run: python -m pytest -q tests/conformance
      - name: Conformance run (fails on any wrong proof)
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: |
          chmod +x build/prism
          python tools/conformance.py --out conformance-out
      - name: Metrics to job summary
        if: always()
        run: test -f conformance-out/metrics.md && cat conformance-out/metrics.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-metrics
          path: conformance-out/
          retention-days: 30

  random-programs:
    name: Random-program soundness (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sanitizer runtimes, bwrap, csmith
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev bubblewrap csmith
          python -m pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: prism-conformance-bin
          path: build
      - name: In-house generator (fails on any wrong proof)
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: |
          chmod +x build/prism
          python tools/csmith_soundness.py -n "${{ github.event.inputs.random_programs || '300' }}" \
            --seed "${{ github.run_number }}" --out soundness-out/inhouse
      - name: Csmith (scalar-only configuration)
        if: always()
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: python tools/csmith_soundness.py --generator csmith -n 100 --seed "${{ github.run_number }}" --out soundness-out/csmith
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-program-soundness
          path: soundness-out/
          retention-days: 30

  juliet:
    name: NIST Juliet subsets (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - uses: actions/cache@v4
        with:
          path: juliet-cache/juliet-c-cplusplus-v1.3.zip
          key: juliet-1.3-ada9d7e1c323d283446df3f55bdee0d00bda1fed786785fe98764d58688f38eb
      - name: Fetch (sha256-checked) and extract
        run: python tools/conformance.py --fetch-juliet juliet-cache
      - uses: actions/download-artifact@v4
        with:
          name: prism-conformance-bin
          path: build
      - name: Juliet run (fails on any wrong proof)
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: |
          chmod +x build/prism
          python tools/conformance.py --suite juliet-cache/juliet --out juliet-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: juliet-metrics
          path: juliet-out/
          retention-days: 30
