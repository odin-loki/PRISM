name: PRISM conformance (release gate)

# Roadmap 2.7 / 6.1 / 6.2. Any wrong proof (PROVED, PROVED-UNBOUNDED,
# PROVED-ASSUMING or PROVED-CERTIFIED on a task with a known violation)
# fails this workflow and blocks a release. See docs/CONFORMANCE.md.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: adds random-program testing and Juliet
  workflow_dispatch:
    inputs:
      random_programs:
        description: "programs for prism-qa soundness"
        default: "300"

permissions:
  contents: read

jobs:
  build:
    name: Build prism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-conf-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/z3/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: ccache-conf-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/z3/CMakeLists.txt') }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=OFF -DPRISM_Z3=ON
      - name: Build
        run: cmake --build build --target prism prism-qa
      - uses: actions/upload-artifact@v4
        with:
          name: prism-conformance-bin
          path: |
            build/prism
            build/prism-qa
          retention-days: 7

  conformance:
    name: Conformance suite (soundness gate)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer runtimes, bwrap
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev bubblewrap
      - uses: actions/download-artifact@v4
        with:
          name: prism-conformance-bin
          path: build
      # The scorer's own tests (tests/cpp/test_qa_conformance.cpp) run with
      # prism_tests in ci.yml.
      - name: Suite labels (sanitizer self-check)
        run: |
          chmod +x build/prism build/prism-qa
          build/prism-qa conformance --self-check --out conformance-out
      - name: Conformance run (fails on any wrong proof)
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: |
          # two runs at a time, each (with its solver/clang children) capped
          # at 4 GB: a task that needs more is "no answer", never a lost runner
          build/prism-qa conformance --out conformance-out -j 2 --mem-limit-mb 4096
      - name: Metrics to job summary
        if: always()
        run: test -f conformance-out/metrics.md && cat conformance-out/metrics.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-metrics
          path: conformance-out/
          retention-days: 30

  random-programs:
    name: Random-program soundness (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer runtimes, bwrap, csmith
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev bubblewrap csmith
      - uses: actions/download-artifact@v4
        with:
          name: prism-conformance-bin
          path: build
      - name: In-house generator (fails on any wrong proof)
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: |
          chmod +x build/prism build/prism-qa
          build/prism-qa soundness -n "${{ github.event.inputs.random_programs || '300' }}" \
            --seed "${{ github.run_number }}" --out soundness-out/inhouse
      - name: Csmith (scalar-only configuration)
        if: always()
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: build/prism-qa soundness --generator csmith -n 100 --seed "${{ github.run_number }}" --out soundness-out/csmith
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-program-soundness
          path: soundness-out/
          retention-days: 30

  juliet:
    name: NIST Juliet subsets (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: juliet-cache/juliet-c-cplusplus-v1.3.zip
          key: juliet-1.3-ada9d7e1c323d283446df3f55bdee0d00bda1fed786785fe98764d58688f38eb
      - uses: actions/download-artifact@v4
        with:
          name: prism-conformance-bin
          path: build
      - name: Fetch (curl, sha256-checked) and extract (unzip)
        run: |
          chmod +x build/prism build/prism-qa
          build/prism-qa conformance --fetch-juliet juliet-cache
      - name: Juliet run (fails on any wrong proof)
        env:
          PRISM_BIN: ${{ github.workspace }}/build/prism
        run: build/prism-qa conformance --suite juliet-cache/juliet --out juliet-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: juliet-metrics
          path: juliet-out/
          retention-days: 30
