name: docs

# Roadmap 6.4 / 6.5: every artefact the assurance package cites exists
# (paths, doctest and test names, anchors, Lean theorem names) and every
# Markdown anchor link resolves. prism_docs_check needs neither the engine
# nor Z3, so this job builds only that target. The check that the user guide
# documents every CLI flag needs the engine's --help and runs in prism_tests
# (tests/cpp/test_qa.cpp) in ci.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out FORGE main (mandatory, unpinned)
        uses: actions/checkout@v4
        with:
          repository: odin-loki/FORGE
          ref: main
          path: _forge
      - name: Pinned CMake (scripts/fetch_toolchain.py, SHA-256 verified)
        shell: bash
        run: |
          d=$(python3 scripts/fetch_toolchain.py cmake)
          echo "$(echo "$d"/cmake-*/bin)" >> "$GITHUB_PATH"
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure (no Z3, no engine tests)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DFORGE_SOURCE_DIR=${{ github.workspace }}/_forge
          -DPRISM_CUDA=OFF -DPRISM_QT=OFF -DPRISM_Z3=OFF -DPRISM_TESTS=OFF
      - name: Build prism_docs_check
        run: cmake --build build --target prism_docs_check
      - name: Assurance package cites only existing artefacts
        run: ./build/prism_docs_check assurance-check
      - name: Every Markdown anchor resolves
        run: ./build/prism_docs_check anchors
