name: PRISM CI

on:
  push:
  pull_request:

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  supply-chain:
    name: Licence firewall + manifest + SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      # prism-deps links the standard library only: nothing from third_party/
      # is compiled before the checks below pass. PRISM_DEPS_ONLY configures
      # that one target (no Z3, no PCRE2).
      - name: Build prism-deps
        run: |
          cmake -B build-deps -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DPRISM_DEPS_ONLY=ON
          cmake --build build-deps --target prism-deps
      - name: Licence firewall (no copyleft in linked components)
        run: build-deps/prism-deps licence-check
      - name: Linked libraries match third_party/MANIFEST.toml
        run: build-deps/prism-deps linked
      - name: Linked libraries match the pinned upstream archives (sha256)
        run: build-deps/prism-deps linked --refetch
      - name: CycloneDX SBOM
        run: build-deps/prism-deps sbom --version "${GITHUB_SHA::12}" -o prism.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: prism-sbom
          path: prism.cdx.json
          retention-days: 30

  cpp:
    name: C++ engine (build + prism_tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # python3-minimal: BenchExec SV-COMP tool-info smoke only; Z3 build is Python-free (phase 6).
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang ccache qt6-base-dev libgl-dev libclang-18-dev python3-minimal
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/z3/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/z3/CMakeLists.txt') }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=ON -DPRISM_Z3=ON
      - name: Build
        run: cmake --build build
      # Phase-5 Python allow-list gate: tests/cpp/test_deps.cpp (no extra Python step).
      - name: prism_tests
        run: ./build/prism_tests
      - name: prism_gui_tests (the window, offscreen)
        run: QT_QPA_PLATFORM=offscreen ./build/prism_gui_tests
      - name: SV-COMP archive packager smoke
        run: ./build/prism svcomp pack --out /tmp/prism-svcomp.tar.gz && tar tzf /tmp/prism-svcomp.tar.gz
      # BenchExec loads tool-info modules as Python classes: tools/svcomp/prism.py
      # is BenchExec's plugin interface (moving upstream), not PRISM code.
      - name: SV-COMP BenchExec tool-info smoke
        run: |
          python3 -m venv /tmp/benchexec && /tmp/benchexec/bin/pip install benchexec
          cd /tmp && PYTHONPATH="$GITHUB_WORKSPACE/tools/svcomp" \
            /tmp/benchexec/bin/python -m benchexec.test_tool_info .prism --tool-directory "$GITHUB_WORKSPACE/build" --no-container
      - name: GUI smoke (headless Qt, real pipeline run through the window)
        run: |
          mkdir -p gui-smoke/src
          cp testdata/planted/add_overflow.c testdata/planted/div_param.c testdata/planted/oob_write.c gui-smoke/src/
          QT_QPA_PLATFORM=offscreen timeout 600 ./build/prism_gui gui-smoke/src --no-llm \
            --stage inventory,classify,lints,bmc --out gui-smoke/out \
            --smoke-screenshot gui-smoke/prism_gui.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-gui-smoke
          path: gui-smoke/prism_gui.png
          retention-days: 7
      - name: PRISM_BIN smoke (e2e lives in prism_tests / ctest)
        run: |
          ./build/prism testdata/planted/abs_ok.c --no-llm --stage inventory --out /tmp/prism-smoke-out
          test -f /tmp/prism-smoke-out/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: prism-linux
          path: build/prism
          retention-days: 7

  # Phase 5 MSVC port: prism_core uses prism::i128 (wide_int.hpp), not native __int128.
  # Smoke-build prism_core + prism with VS clang-cl (MSVC ABI), Z3 off (skip vendored Z3),
  # tests off (solver Z3 integration tests compile on Windows when PRISM_HAS_Z3).
  # Smoke: prism_core + prism + prism-qa + portable prism_tests (phase 7 subset).
  # Native MSVC cl (not clang-cl): same smoke as windows-compile-smoke; needs
  # portable signed overflow in stages/interp.cpp (no __builtin_*_overflow on cl).
  windows-compile-smoke-cl:
    name: Windows compile smoke (MSVC cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: build-win-cl
          key: win-smoke-cl-${{ hashFiles('CMakeLists.txt', 'third_party/pcre2/CMakeLists.txt') }}
          restore-keys: win-smoke-cl-${{ hashFiles('CMakeLists.txt', 'third_party/pcre2/CMakeLists.txt') }}-
      - name: Configure (Ninja + cl)
        run: >
          cmake -B build-win-cl -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=OFF -DPRISM_Z3=OFF
          -DPRISM_TESTS=ON -DPRISM_TESTS_WIN_SUBSET=ON -DPRISM_LIBCLANG=OFF
      - name: Build (prism_core + prism + prism-qa + prism_tests)
        run: cmake --build build-win-cl --target prism_core prism prism-qa prism_tests
      - name: Run portable prism_tests subset
        run: .\build-win-cl\prism_tests.exe
      - name: PRISM_BIN smoke (real PE prism.exe)
        run: |
          .\build-win-cl\prism.exe testdata\planted\abs_ok.c --no-llm --stage inventory --out prism-smoke-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path prism-smoke-out\report.json)) { Write-Error "no report.json"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: prism-windows
          path: build-win-cl/prism.exe
          retention-days: 7

  windows-compile-smoke:
    name: Windows compile smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: build-win
          key: win-smoke-${{ hashFiles('CMakeLists.txt', 'third_party/pcre2/CMakeLists.txt') }}
          restore-keys: win-smoke-${{ hashFiles('CMakeLists.txt', 'third_party/pcre2/CMakeLists.txt') }}-
      - name: Configure (Ninja + clang-cl)
        run: >
          cmake -B build-win -G Ninja
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=OFF -DPRISM_Z3=OFF
          -DPRISM_TESTS=ON -DPRISM_TESTS_WIN_SUBSET=ON -DPRISM_LIBCLANG=OFF
      - name: Build (prism_core + prism + prism-qa + prism_tests)
        run: cmake --build build-win --target prism_core prism prism-qa prism_tests
      - name: Put clang ASan runtime DLLs on PATH (label self-check)
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) { Write-Host "clang.exe not on PATH: label self-check will be NOTRUN"; exit 0 }
          $root = Split-Path (Split-Path $clang)
          $dll = Get-ChildItem -Path "$root\lib\clang" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { $dll.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH; Write-Host "ASan DLL dir: $($dll.DirectoryName)" }
          else { Write-Host "no clang ASan DLL under ${root}: label self-check will be NOTRUN" }
      - name: Run portable prism_tests subset
        run: .\build-win\prism_tests.exe

  # Phase 5b: vendored Z3 via z3gen (cmake/z3.cmake) + pre-generated cmake/z3-generated/.
  windows-compile-smoke-z3:
    name: Windows compile smoke (Z3)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Restore/save split. The old restore-keys (exact hash + "-") could never match,
      # so any Z3 input change was a cold build, and the cache was saved only if the
      # whole job passed. A miss now falls back to the newest win-smoke-z3- cache (ninja
      # rebuilds only what changed) and libz3 is saved as soon as it is built.
      - uses: actions/cache/restore@v4
        id: z3cache
        with:
          path: build-win-z3
          key: win-smoke-z3-${{ hashFiles('CMakeLists.txt', 'cmake/z3.cmake', 'cmake/z3-generated/tree_sha256', 'third_party/z3/CMakeLists.txt') }}
          restore-keys: win-smoke-z3-
      # Warm-cache fix: a fresh checkout stamps every Z3 source (and the generated
      # cmake/z3-generated inputs) with the checkout time, which is newer than the
      # restored objects, so Ninja recompiles all of libz3 although nothing changed.
      # On an EXACT key hit the tree is byte-identical to the one that was built (the key
      # includes cmake/z3-generated/tree_sha256, the Z3 tree digest), so the sources are
      # backdated below the restored objects. Never done on a restore-keys fallback: there
      # the sources may differ, and stale objects must rebuild.
      - name: Backdate Z3 sources (exact cache hit only)
        if: steps.z3cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $old = [datetime]'2000-01-01T00:00:00Z'
          $n = 0
          foreach ($d in 'third_party/z3', 'cmake/z3-generated') {
            Get-ChildItem -Path $d -Recurse -File | ForEach-Object { $_.LastWriteTimeUtc = $old; $n++ }
          }
          Write-Host "backdated $n files"
      - name: Configure (Ninja + clang-cl, PRISM_Z3=ON)
        run: >
          cmake -B build-win-z3 -G Ninja
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=OFF -DPRISM_Z3=ON
          -DPRISM_TESTS=ON -DPRISM_TESTS_WIN_SUBSET=ON -DPRISM_LIBCLANG=OFF
      # On a warm (exact) hit, `-d explain` prints why Ninja rebuilds anything at all.
      - name: Build vendored Z3 (libz3)
        shell: pwsh
        run: |
          if ('${{ steps.z3cache.outputs.cache-hit }}' -eq 'true') { cmake --build build-win-z3 --target libz3 -- -d explain } else { cmake --build build-win-z3 --target libz3 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: steps.z3cache.outputs.cache-hit != 'true'
        with:
          path: build-win-z3
          key: win-smoke-z3-${{ hashFiles('CMakeLists.txt', 'cmake/z3.cmake', 'cmake/z3-generated/tree_sha256', 'third_party/z3/CMakeLists.txt') }}
      - name: Build (prism_core + prism + prism-qa + prism_tests)
        run: cmake --build build-win-z3 --target prism_core prism prism-qa prism_tests
      - name: Put clang ASan runtime DLLs on PATH (label self-check)
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) { Write-Host "clang.exe not on PATH: label self-check will be NOTRUN"; exit 0 }
          $root = Split-Path (Split-Path $clang)
          $dll = Get-ChildItem -Path "$root\lib\clang" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { $dll.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH; Write-Host "ASan DLL dir: $($dll.DirectoryName)" }
          else { Write-Host "no clang ASan DLL under ${root}: label self-check will be NOTRUN" }
      # PIR e2e on Windows needs clang + opt. The stock LLVM install on the runner has
      # clang but no opt.exe, so test_pir_e2e reports NOTRUN. This step fetches the
      # official LLVM 18.1.8 MSVC archive (the version PIR is validated against, see
      # kInstall in src/prism/pir/stage.cpp) and unpacks only bin/clang.exe, bin/opt.exe
      # and the clang resource headers. clang is installed as clang-18.exe (find_frontend
      # looks for clang-18 first), so the runner's clang.exe, and with it the ASan DLL
      # lookup and label self-check above, are untouched. Best effort: if the download
      # fails, the e2e cases print "NOTRUN" (Law 1), they never pass quietly.
      - name: Cache LLVM 18 (clang-18 + opt for PIR e2e)
        uses: actions/cache@v4
        id: llvm18
        with:
          path: C:\llvm18
          key: win-llvm-18.1.8-pir-v1
      - name: Install LLVM 18 clang-18 + opt (PIR e2e C subset)
        if: steps.llvm18.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "clang+llvm-18.1.8-x86_64-pc-windows-msvc"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/$name.tar.xz"
          $tar = Join-Path $env:RUNNER_TEMP "llvm18.tar.xz"
          try {
            curl.exe -sSL --retry 3 -o $tar $url
            if ($LASTEXITCODE -ne 0) { throw "download failed" }
            New-Item -ItemType Directory -Force C:\llvm18 | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf $tar -C C:\llvm18 --strip-components=1 "$name/bin/clang.exe" "$name/bin/opt.exe" "$name/lib/clang/18/include"
            if ($LASTEXITCODE -ne 0) { throw "extract failed" }
            Move-Item C:\llvm18\bin\clang.exe C:\llvm18\bin\clang-18.exe -Force
          } catch {
            # Never let actions/cache save a half-unpacked tree under the key.
            Remove-Item -Recurse -Force C:\llvm18 -ErrorAction SilentlyContinue
            throw
          }
      - name: Put LLVM 18 (clang-18, opt) on PATH
        shell: pwsh
        run: |
          if ((Test-Path C:\llvm18\bin\opt.exe) -and (Test-Path C:\llvm18\bin\clang-18.exe)) {
            "C:\llvm18\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Host "LLVM 18 on PATH: PIR e2e C subset will run"
          } else {
            Write-Host "::warning::LLVM 18 opt.exe not available: PIR e2e cases will be NOTRUN"
          }
      - name: Run portable prism_tests subset (Z3 + leanbb)
        run: .\build-win-z3\prism_tests.exe

  # Phase 5c + 5b: native MSVC cl with vendored Z3 (Release; same subset as clang-cl Z3).
  windows-compile-smoke-cl-z3:
    name: Windows compile smoke (MSVC cl, Z3)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Restore/save split. The old restore-keys (exact hash + "-") could never match,
      # so any Z3 input change was a cold build, and the cache was saved only if the
      # whole job passed. A miss now falls back to the newest win-smoke-cl-z3- cache (ninja
      # rebuilds only what changed) and libz3 is saved as soon as it is built.
      - uses: actions/cache/restore@v4
        id: z3cache
        with:
          path: build-win-cl-z3
          key: win-smoke-cl-z3-${{ hashFiles('CMakeLists.txt', 'cmake/z3.cmake', 'cmake/z3-generated/tree_sha256', 'third_party/z3/CMakeLists.txt') }}
          restore-keys: win-smoke-cl-z3-
      # Warm-cache fix: see the clang-cl Z3 job (checkout mtimes are newer than the
      # restored objects; backdate sources on an exact key hit only).
      - name: Backdate Z3 sources (exact cache hit only)
        if: steps.z3cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $old = [datetime]'2000-01-01T00:00:00Z'
          $n = 0
          foreach ($d in 'third_party/z3', 'cmake/z3-generated') {
            Get-ChildItem -Path $d -Recurse -File | ForEach-Object { $_.LastWriteTimeUtc = $old; $n++ }
          }
          Write-Host "backdated $n files"
      - name: Configure (Ninja + cl, PRISM_Z3=ON)
        run: >
          cmake -B build-win-cl-z3 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=OFF -DPRISM_Z3=ON
          -DPRISM_TESTS=ON -DPRISM_TESTS_WIN_SUBSET=ON -DPRISM_LIBCLANG=OFF
      - name: Build vendored Z3 (libz3)
        shell: pwsh
        run: |
          if ('${{ steps.z3cache.outputs.cache-hit }}' -eq 'true') { cmake --build build-win-cl-z3 --target libz3 -- -d explain } else { cmake --build build-win-cl-z3 --target libz3 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: steps.z3cache.outputs.cache-hit != 'true'
        with:
          path: build-win-cl-z3
          key: win-smoke-cl-z3-${{ hashFiles('CMakeLists.txt', 'cmake/z3.cmake', 'cmake/z3-generated/tree_sha256', 'third_party/z3/CMakeLists.txt') }}
      - name: Build (prism_core + prism + prism-qa + prism_tests)
        run: cmake --build build-win-cl-z3 --target prism_core prism prism-qa prism_tests
      # PIR e2e: same LLVM 18 clang-18 + opt as the clang-cl Z3 job (see comment there).
      - name: Cache LLVM 18 (clang-18 + opt for PIR e2e)
        uses: actions/cache@v4
        id: llvm18
        with:
          path: C:\llvm18
          key: win-llvm-18.1.8-pir-v1
      - name: Install LLVM 18 clang-18 + opt (PIR e2e C subset)
        if: steps.llvm18.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "clang+llvm-18.1.8-x86_64-pc-windows-msvc"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/$name.tar.xz"
          $tar = Join-Path $env:RUNNER_TEMP "llvm18.tar.xz"
          try {
            curl.exe -sSL --retry 3 -o $tar $url
            if ($LASTEXITCODE -ne 0) { throw "download failed" }
            New-Item -ItemType Directory -Force C:\llvm18 | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf $tar -C C:\llvm18 --strip-components=1 "$name/bin/clang.exe" "$name/bin/opt.exe" "$name/lib/clang/18/include"
            if ($LASTEXITCODE -ne 0) { throw "extract failed" }
            Move-Item C:\llvm18\bin\clang.exe C:\llvm18\bin\clang-18.exe -Force
          } catch {
            Remove-Item -Recurse -Force C:\llvm18 -ErrorAction SilentlyContinue
            throw
          }
      - name: Put LLVM 18 (clang-18, opt) on PATH
        shell: pwsh
        run: |
          if ((Test-Path C:\llvm18\bin\opt.exe) -and (Test-Path C:\llvm18\bin\clang-18.exe)) {
            "C:\llvm18\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Host "LLVM 18 on PATH: PIR e2e C subset will run"
          } else {
            Write-Host "::warning::LLVM 18 opt.exe not available: PIR e2e cases will be NOTRUN"
          }
      - name: Run portable prism_tests subset (Z3 + leanbb)
        run: .\build-win-cl-z3\prism_tests.exe

  # Native Qt GUI on Windows: MSVC cl, Qt 6 from jurplel/install-qt-action
  # (aqtinstall), PRISM_QT=ON, PRISM_Z3=OFF (the window needs no solver; skips the
  # vendored Z3 build). Everything runs offscreen (QT_QPA_PLATFORM=offscreen).
  # prism_tests is built too so the `prism --gui` launcher cases of
  # test_gui_model.cpp run against the real prism_gui.exe beside them.
  windows-gui-qt:
    name: Windows GUI (Qt 6, MSVC cl, offscreen)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt 6 (aqtinstall)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/cache@v4
        with:
          path: build-win-qt
          key: win-qt-${{ hashFiles('CMakeLists.txt', 'third_party/pcre2/CMakeLists.txt') }}
          restore-keys: win-qt-${{ hashFiles('CMakeLists.txt', 'third_party/pcre2/CMakeLists.txt') }}-
      - name: Configure (Ninja + cl, PRISM_QT=ON, PRISM_Z3=OFF)
        run: >
          cmake -B build-win-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          -DPRISM_CUDA=OFF -DPRISM_LLAMA=OFF -DPRISM_QT=ON -DPRISM_Z3=OFF
          -DPRISM_TESTS=ON -DPRISM_TESTS_WIN_SUBSET=ON -DPRISM_LIBCLANG=OFF
      # An unknown target here means Qt6 Widgets was not found (CMake only warns
      # and PRISM_QT quietly builds no GUI): the step fails, never passes empty.
      - name: Build (prism, prism_gui, prism_gui_tests, prism_tests)
        run: cmake --build build-win-qt --target prism prism_gui prism_gui_tests prism_tests
      - name: prism_gui_tests (the window, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\build-win-qt\prism_gui_tests.exe
      - name: prism_tests "gui model" suite (launcher against the real prism_gui.exe)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\build-win-qt\prism_tests.exe --test-suite="gui model"
      - name: GUI smoke (headless Qt, real pipeline run through the window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force gui-smoke\src | Out-Null
          Copy-Item testdata\planted\add_overflow.c, testdata\planted\div_param.c, testdata\planted\oob_write.c gui-smoke\src\
          .\build-win-qt\prism_gui.exe gui-smoke\src --no-llm `
            --stage inventory,classify,lints --out gui-smoke\out `
            --smoke-screenshot gui-smoke\prism_gui.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-gui-smoke-windows
          path: gui-smoke/prism_gui.png
          retention-days: 7

  selfcheck:
    name: PRISM on PRISM (SARIF artifact, not gating)
    runs-on: ubuntu-24.04
    needs: cpp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prism-linux
          path: build
      - name: Polyglot + lints over the repo
        run: |
          chmod +x build/prism
          ./build/prism . --no-llm --stage inventory,lints,polyglot --out prism-out-self || true
      - uses: actions/upload-artifact@v4
        with:
          name: prism-self-report
          path: |
            prism-out-self/report.md
            prism-out-self/report.sarif
          retention-days: 14
