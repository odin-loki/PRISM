# SV-COMP fm-tools registration draft (roadmap 6.3).
# Schema: https://fm-tools.sosy-lab.org/schema.html (format 2.0).
# Upload via https://fm-tools.org/ after filling version and archive URL.
# Note: fm-tools id `prism` is the Oxford probabilistic model checker; use a
# distinct id (here `prism-svcomp`) unless coordinators assign another.

id: prism-svcomp
name: PRISM
description: >
  Performance, Regression, Integration and Security Module — hybrid C/C++
  verifier with BMC, Clang/LLVM PIR front end, and SV-COMP witness export.
  Default data model is LP64. BMC supports opt-in ILP32 (--data-model ILP32;
  32-bit long/size_t/pointers; replay -m32). pir stays LP64 (NOTRUN on ILP32).
  valid-memsafety refutations only; no true memsafety proofs yet.
  Submission archive: `prism svcomp pack` (dependencies.json lists host clang/opt).
  Runtime: clang/llvm 18, bubblewrap; verifier is the C++ prism binary.
input_languages:
  - C
