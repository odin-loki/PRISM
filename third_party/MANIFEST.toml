# PRISM third-party manifest (roadmap Part 1.1).
#
# One [[component]] per dependency. Read by scripts/fetch_deps.py,
# scripts/sbom.py, scripts/licence_check.py, prism/config.py and (at CMake
# configure time) CMakeLists.txt, which bakes name -> commit into the C++
# engine so `prism` knows which ~/.prism/tools/<name>/<commit>/ to trust.
#
# kind:
#   linked    compiled into PRISM from the source copy under `path`. Must carry a
#             permissive SPDX licence (scripts/licence_check.py fails otherwise).
#   external  run as a separate, unmodified process. Never linked. Fetched by
#             `python scripts/fetch_deps.py --tool NAME` into
#             ~/.prism/tools/<name>/<commit>/ (bin/ holds the executables).
#   system    taken from the host (package manager / PATH). Not pinned by SHA;
#             PRISM still records "path:<abs>;sha256:<file hash>" as tool_sha.
#
# commit          the exact upstream commit (40 hex). Resolved with
#                 `git ls-remote <url> refs/tags/<tag>` (peeled ^{} for annotated tags).
# archive_sha256  SHA-256 of the *uncompressed* tar produced by
#                   git archive --format=tar --prefix=<name>-<commit>/ <commit>
#                 after `git fetch --depth 1 <url> <commit>`. The git fetch is
#                 content-addressed by the commit id; the SHA-256 is a second,
#                 collision-resistant check over the exact bytes PRISM builds from.
#                 (GitHub's .tar.gz archive endpoints were not reachable from the
#                 machine that pinned these, and their gzip bytes are not a
#                 stable contract; the git-archive tar is.)
# tree_sha256     (linked) SHA-256 over sorted "<relpath>\0<sha256(file)>\n" lines of
#                 the in-tree copy; `fetch_deps.py --tree-digest DIR` prints it.
# drift           (linked) files where the in-tree copy differs from the pinned
#                 upstream tree: "D path" upstream only, "M path" content differs,
#                 "A path" in-tree only. `fetch_deps.py --linked --refetch` checks it.
# spdx            read from the licence file in the source tree (licence_file),
#                 before the mined copies were deleted from this repository.
#
# Provenance of the pins (2026-09-23):
#   third_party/vendor.log recorded clone URLs and timestamps (2026-09-19) but no
#   commit hashes: the mined trees were shallow clones with .git removed.
#   * Linked libraries: the version was read from the in-tree source
#     (CMakeLists / configure.ac / version macros), the matching upstream tag
#     resolved with `git ls-remote`, and the tag's git tree compared file by file
#     with the in-tree copy. Every file matches except the ones listed under
#     `drift` (line-ending / trailing-whitespace edits and files the vendoring
#     dropped). llama.cpp has no version string in tree: its commit was found by
#     comparing the in-tree tree against every upstream commit since 2025-09-01;
#     3eb2be1 (tag b6875) is the only exact match.
#   * External tools: pinned to the upstream release tag at or just below the
#     version string found in the mined copy (e.g. cppcheck 2.21.99 -> 2.21.1,
#     KLEE 3.3-pre -> v3.2, Dafny 4.11.1-dev -> v4.11.0). The mined snapshots
#     themselves were development heads and are not reproducible.
#   * cadical, kissat, cake_lpr were added for certified mode (roadmap 3.2).
#   * bitwuzla is a portfolio member (roadmap 3.1), built with meson.
#
# The fifteen mined source trees were removed from third_party/ (roadmap 1.1);
# docs/MINED.md records what PRISM re-implemented from each. They are listed at
# the end under [[mined]] for provenance and attribution only.

schema = 1
archive_format = "git-archive-tar"

