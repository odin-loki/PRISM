# ----------------------------------------------------------------- mined ----
# Source trees that used to sit in third_party/ and were deleted (roadmap 1.1).
# Not fetched, not built, not invoked. Kept for provenance and attribution;
# docs/MINED.md lists what PRISM re-implemented from each. Tools that PRISM
# still invokes (esbmc, cbmc, ...) are the [[component]] rows above.

[[mined]]
name = "rapidcheck"
url = "https://github.com/emil-e/rapidcheck"
spdx = "BSD-2-Clause"
note = "property-based testing ideas re-implemented in prism/rapid.py; no release tags upstream"

[[mined]]
name = "FuSeBMC"
url = "https://github.com/kaled-alshmrany/FuSeBMC"
spdx = "NOASSERTION"
note = "no licence file in the mined copy and the upstream repository is no longer public; goal-labelling algorithm re-implemented in prism/fuse.py from the published papers"

[[mined]]
name = "Fuzz4All"
url = "https://github.com/fuzz4all/fuzz4all"
spdx = "CC-BY-4.0"
note = "autoprompt / mutate loop re-implemented in prism/fuse.py; attribution in NOTICE"

[[mined]]
name = "codeql"
url = "https://github.com/github/codeql"
spdx = "MIT"
note = "the queries repository is MIT but the CodeQL engine/CLI is under the GitHub CodeQL Terms (restricted commercial use); the CodeQL adapter was removed from both engines (roadmap 1.2)"
