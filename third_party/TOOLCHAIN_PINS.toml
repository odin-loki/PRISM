# Build toolchain and large system dependencies: pinned to exact versions with SHA-256,
# fetched (never committed: too large for git) by scripts/fetch_toolchain.py into
# ~/.prism/toolchain/<name>/<version>/. Linked libraries are vendored and pinned in
# MANIFEST.toml; external analysis tools are pinned there too ([[component]] kind=external).
# LLVM/clang is pinned separately in third_party/llvm/PIN.toml (branch prism-llvm, 23.1.4).
# FORGE is deliberately NOT pinned or vendored: it tracks odin-loki/FORGE main (mandatory).
# Checksums were read from each upstream's own checksum file on 2026-10-31.

schema = 1

[[pin]]
name = "cmake"
version = "3.31.6"
source = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-SHA-256.txt"
