# Lean 4: pinned by proofs/**/lean-toolchain (leanprover/lean4:v4.34.0) and the
# lake-manifest.json revs (Mathlib etc. by git commit). elan resolves the toolchain.
[[pin]]
name = "lean4"
version = "v4.34.0"
source = "proofs/lean-toolchain + proofs/**/lake-manifest.json"

# --- Lint tools (polyglot / CI). Exact versions + SHA-256; kind = "lint". ---
# clang-tidy is not a separate download: it ships inside the pinned LLVM archive
# (third_party/llvm/PIN.toml, LLVM 23.1.4 on prism-llvm) and is verified with it.
[[pin]]
name = "clang-tidy"
version = "23.1.4"
kind = "lint"
from_pin = "third_party/llvm/PIN.toml"
bin = "bin/clang-tidy"

